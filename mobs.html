
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Mob Wiki</title>
<link rel="stylesheet" href="style.css">

<style>
#mobList {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
}

.mob-card {
    background: #293b2c;
    border: 2px solid #527c43;
    padding: 18px;
    border-radius: 9px;
    color: white;
    cursor: pointer;
    text-align: center;
    transition: .2s;
}

.mob-card:hover {
    background: #405d39;
    transform: translateY(-4px);
    border-color: #9be36c;
}

.mob-card h3 {
    margin: 0;
    font-size: 1.05rem;
}

#mobSearch {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    margin: 15px 0 25px;
    border-radius: 7px;
    border: 2px solid #527c43;
    font-size: 16px;
}

#details {
    display: none;
}

.info-box {
    background: #293b2c;
    border: 1px solid #527c43;
    border-radius: 9px;
    padding: 18px;
    margin: 15px 0;
}

.info-box h3 {
    color: #9be36c;
    margin-top: 0;
}

.back-button {
    background: #5b963e;
    color: white;
    border: 2px solid #9be36c;
    border-radius: 6px;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 20px;
}

.mob-facts {
    line-height: 1.9;
    white-space: pre-line;
}

</style>
</head>

<body>

<header>
    <h1>MINECRAFT MOB WIKI</h1>
    <p>Discover the mobs in Minecraft Java Edition!</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="mobs.html">Mobs</a>
</nav>

<main>

    <section id="listSection">
        <h2>Minecraft Mob Database</h2>
        <p>Select a mob to view its information.</p>

        <input
            id="mobSearch"
            type="text"
            placeholder="Search for a mob..."
            aria-label="Search for a mob"
        >

        <div id="mobList"></div>
        <p id="noResults" style="display:none">No mobs found.</p>
    </section>

    <section id="details">

        <button class="back-button" id="backButton" type="button">
            Back to Mobs
        </button>

        <div class="info-box">
            <h1 id="mobName"></h1>
        </div>

        <div class="info-box">
            <h3>Occurrence</h3>
            <div id="mobSpawn" class="mob-facts"></div>
        </div>

        <div class="info-box">
            <h3>Behavior</h3>
            <div id="mobBehavior" class="mob-facts"></div>
        </div>

        <div class="info-box">
            <h3>Health</h3>
            <div id="mobHealth" class="mob-facts"></div>
        </div>

        <div class="info-box">
            <h3>Drops</h3>
            <div id="mobDrops" class="mob-facts"></div>
        </div>

        <div class="info-box">
            <h3>Interesting Facts</h3>
            <div id="mobFacts" class="mob-facts"></div>
        </div>

        <button class="back-button" id="backButtonBottom" type="button">
            Back to Mobs
        </button>

    </section>

</main>

<footer>
    Minecraft Mob Wiki | Java Edition Fan Website
</footer>

const mobList = document.getElementById("mobList");
const searchInput = document.getElementById("mobSearch");
const listSection = document.getElementById("listSection");
const detailsSection = document.getElementById("details");

function renderMobs() {

    const search = searchInput.value.trim().toLowerCase();

    const filtered = mobs.filter(name =>
        name.toLowerCase().includes(search)
    );

    mobList.innerHTML = "";

    filtered.forEach(name => {

        const card = document.createElement("button");
        card.type = "button";
        card.className = "mob-card";

        const heading = document.createElement("h3");
        heading.textContent = name;

        card.appendChild(heading);

        card.addEventListener("click", () => showMob(name));

        mobList.appendChild(card);
    });

    document.getElementById("noResults").style.display =
        filtered.length === 0 ? "block" : "none";
}

function showMob(name) {

    const info = mobData[name];

    document.getElementById("mobName").textContent = name;

    if (info) {
        document.getElementById("mobSpawn").textContent = info[0];
        document.getElementById("mobBehavior").textContent = info[1];
        document.getElementById("mobHealth").textContent = info[2];
        document.getElementById("mobDrops").textContent = info[3];
        document.getElementById("mobFacts").textContent = info[4];
    } else {
        document.getElementById("mobSpawn").textContent =
            "Information not available yet.";
        document.getElementById("mobBehavior").textContent =
            "Information not available yet.";
        document.getElementById("mobHealth").textContent =
            "Information not available yet.";
        document.getElementById("mobDrops").textContent =
            "Information not available yet.";
        document.getElementById("mobFacts").textContent =
            "Information not available yet.";
    }

    listSection.style.display = "none";
    detailsSection.style.display = "block";

    history.replaceState(null, "", "#" + encodeURIComponent(name));

    window.scrollTo(0, 0);
}

function showList() {

    detailsSection.style.display = "none";
    listSection.style.display = "block";

    history.replaceState(null, "", window.location.pathname);

    window.scrollTo(0, 0);
}

searchInput.addEventListener("input", renderMobs);

document.getElementById("backButton")
    .addEventListener("click", showList);

document.getElementById("backButtonBottom")
    .addEventListener("click", showList);

renderMobs();

if (location.hash) {

    const name = decodeURIComponent(location.hash.substring(1));

    if (mobs.includes(name)) {
        showMob(name);
    }
}
