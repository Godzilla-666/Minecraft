
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Mob Wiki</title>
<link rel="stylesheet" href="style.css">

<style>
#mobList {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
}
.mob-card {
    background:#293b2c;
    border:2px solid #527c43;
    padding:18px;
    border-radius:9px;
    color:white;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}
.mob-card:hover {
    background:#405d39;
    transform:translateY(-4px);
    border-color:#9be36c;
}
.mob-icon {font-size:38px;display:block;margin-bottom:8px}
.mob-card h3 {margin:5px}
.mob-card small {color:#b8cbb5}
#mobSearch {
    width:100%;
    padding:14px;
    margin:15px 0 25px;
    border-radius:7px;
    border:2px solid #527c43;
    font-size:16px;
}
#details {display:none}
.info-box {
    background:#293b2c;
    border:1px solid #527c43;
    border-radius:9px;
    padding:18px;
    margin:15px 0;
}
.info-box h3 {color:#9be36c;margin-top:0}
.back-button {
    background:#5b963e;
    color:white;
    border:2px solid #9be36c;
    border-radius:6px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:20px;
}
.mob-facts {line-height:1.9}
</style>
</head>

<body>

<header>
    <h1>⛏ MINECRAFT MOB WIKI</h1>
    <p>Discover every creature in Minecraft!</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="mobs.html">Mobs</a>
</nav>

<main>

<section id="listSection">
    <h2>👾 Minecraft Mob Database</h2>
    <p>Click on a mob to discover everything about it!</p>

    <input id="mobSearch" type="text"
    placeholder="🔎 Search for a mob..."
    oninput="renderMobs()">

    <div id="mobList"></div>
    <p id="noResults" style="display:none">No mobs found!</p>
</section>

<section id="details">
    <button class="back-button" onclick="showList()">
        ← Back to Mobs
    </button>

    <div class="info-box" style="text-align:center">
        <div id="mobIcon" style="font-size:75px"></div>
        <h1 id="mobName"></h1>
        <p id="mobSubtitle"></p>
    </div>

    <div class="info-box">
        <h3>📍 Occurrence</h3>
        <div id="mobSpawn" class="mob-facts"></div>
    </div>

    <div class="info-box">
        <h3>⚔️ Behavior</h3>
        <div id="mobBehavior" class="mob-facts"></div>
    </div>

    <div class="info-box">
        <h3>❤️ Health</h3>
        <div id="mobHealth" class="mob-facts"></div>
    </div>

    <div class="info-box">
        <h3>🎁 Drops</h3>
        <div id="mobDrops" class="mob-facts"></div>
    </div>

    <div class="info-box">
        <h3>✨ Experience</h3>
        <div id="mobXP" class="mob-facts"></div>
    </div>

    <div class="info-box">
        <h3>🧠 Interesting Facts</h3>
        <div id="mobFacts" class="mob-facts"></div>
    </div>

    <button class="back-button" onclick="showList()">
        ← Back to Mobs
    </button>
</section>

</main>

<footer>
    Minecraft Mob Wiki | Java Edition Fan Website
</footer>

function renderMobs() {
    const search = document.getElementById("mobSearch").value.toLowerCase();
    const list = document.getElementById("mobList");

    const filtered = mobs.filter(m =>
        m.name.toLowerCase().includes(search)
    );

    list.innerHTML = filtered.map(m => `
        <div class="mob-card" onclick="showMob('${m.name}')">
            <span class="mob-icon">${m.icon}</span>
            <h3>${m.name}</h3>
            <small>${m.type}</small>
        </div>
    `).join("");

    document.getElementById("noResults").style.display =
        filtered.length ? "none" : "block";
}

function showMob(name) {
    const mob = mobs.find(m => m.name === name);
    if (!mob) return;

    document.getElementById("listSection").style.display = "none";
    document.getElementById("details").style.display = "block";

    document.getElementById("mobIcon").textContent = mob.icon;
    document.getElementById("mobName").textContent = mob.name;
    document.getElementById("mobSubtitle").textContent =
        "Minecraft Java Edition • " + mob.type;

    document.getElementById("mobSpawn").textContent = mob.spawn;
    document.getElementById("mobBehavior").textContent = mob.behavior;
    document.getElementById("mobHealth").textContent =
        mob.health + " HP (" + mob.health / 2 + " hearts)";
    document.getElementById("mobDrops").textContent = mob.drops;
    document.getElementById("mobXP").textContent = mob.xp;

    document.getElementById("mobFacts").innerHTML =
        mob.facts.map(f => `<p>• ${f}</p>`).join("");

    window.scrollTo(0,0);
    history.replaceState(null,"","#"+encodeURIComponent(mob.name));
}

function showList() {
    document.getElementById("details").style.display = "none";
    document.getElementById("listSection").style.display = "block";
    history.replaceState(null,"",window.location.pathname);
    window.scrollTo(0,0);
}

renderMobs();

if (location.hash) {
    const name = decodeURIComponent(location.hash.substring(1));
    if (mobs.some(m => m.name === name)) showMob(name);
}
</script>

</html>
